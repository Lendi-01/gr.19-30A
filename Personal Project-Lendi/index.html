        <div class="container">

                <img src="foto/download.png" class="k-image">
                <nav>
                    <ul class="hmta">

    <div>
         <h1>
            Personal Info Below:
         </h1>
    </div>

    <br>
    
    <fieldset>
      <legend>Personal info:</legend>

    <form action="" class="info-p">
        <label for="firstname">First Name:</label><br>
        <input type="text" name="firstname" id="firstname" required> <br>

        <label for="lastname">Last Name:</label><br>
        <input type="text" name="lastname" id="lastname" required><br>

        <label for="email">Email:</label><br>
        <input type="text" name="email" id="email" required><br>

        <label for="password">Password:</label><br>
        <input type="text" name="password" id="password" required><br>

        <label for="age">Age:</label><br>
        <input type="number" name="age" id="age" required><br><br>

        <label for="gender">Gender:</label><br>
        <input type="radio" name="gender" id="male" value="male">
        <label for="male">Male</label><br>

        <input type="radio" name="gender" id="female" value="female">
        <label for="female">Female</label><br><br>
        
        <label for="Leagues">Favorite League:</label><br>
        <input type="checkbox" name="Premier League" id="Premier League" value="Premier League">
        <label for="Premier League ">Premier League </label><br>

        <input type="checkbox" name="football" id="football" value="football">
        <label for="football">Football</label><br>

        <input type="checkbox" name="voleyball" id="voleyball" value="voleyball">
        <label for="voleyball">Voleyball</label><br>

        <input type="checkbox" name="basketball" id="basketball" value="basketball">
        <label for="basketball">Basketball</label><br><br><br>

        <label for="Your Favorite Team">Choose your Favorite Team:</label>

    <select name="Your Favorite Team" id="teams">
        <option value="teams">Fc Real Madrid</option>
        <option value="teams">Fc Barcelona</option>
        <option value="teams">Fc Atketico Madrid</option>
        <option value="teams">Fc Sevilla</option>
        <option value="teams">Fc Chelsea</option>
        <option value="teams">Fc Liverpool</option>
        <option value="teams">Fc Man City</option>
        <option value="teams">Fc Man United</option>
        <option value="teams">Fc Arsenal</option>
        <option value="teams">Fc Totenham HotSpurs</option>
        <option value="teams">Fc Roma</option>
        <option value="teams">Fc Inter Milan</option>
        <option value="teams">Fc Ac Milan</option>
        <option value="teams">Fc Juventus</option>
        <option value="teams">Fc Lazio</option>
        <option value="teams">Fc Paris SG</option>
        <option value="teams">Fc Marsei</option>
        <option value="teams">Fc Lyon</option>
    </select><br><br>

    <textarea name="message" id="message" rows="10" cols="20"></textarea><br><br>

    <input type="submit" name="submit" id="submit">


    </form>
    </fieldset>
